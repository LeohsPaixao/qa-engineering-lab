name: Testes QA-Engineering-Lab - CI

on:
  pull_request:
    branches:
      - main
      - main-workflow
  workflow_dispatch:

jobs:
  backend-unit-tests:
    uses: ./.github/workflows/backend.yml

  frontend-unit-tests:
    uses: ./.github/workflows/frontend.yml

  cypress-component-tests:
    uses: ./.github/workflows/cypress-component.yml
  
  rest-assured-api-tests:
    uses: ./.github/workflows/restassured.yml

  newman-api-tests:
    uses: ./.github/workflows/newman.yml

  playwright-api-tests:
    uses: ./.github/workflows/playwright-api.yml

  cypress-tests:
    needs: [backend-unit-tests, frontend-unit-tests, cypress-component-tests, rest-assured-api-tests, newman-api-tests, playwright-api-tests]
    if: >-
      always() &&
      (needs.backend-unit-tests.result == 'success' &&
      needs.frontend-unit-tests.result == 'success' &&
      needs.cypress-component-tests.result == 'success' &&
      needs.rest-assured-api-tests.result == 'success' &&
      needs.newman-api-tests.result == 'success' &&
      needs.playwright-api-tests.result == 'success')
    uses: ./.github/workflows/cypress.yml

  playwright-e2e-tests:
    needs: [backend-unit-tests, frontend-unit-tests, cypress-component-tests, rest-assured-api-tests, newman-api-tests, playwright-api-tests]
    if: >-
      always() &&
      (needs.backend-unit-tests.result == 'success' &&
      needs.frontend-unit-tests.result == 'success' &&
      needs.cypress-component-tests.result == 'success' &&
      needs.rest-assured-api-tests.result == 'success' &&
      needs.newman-api-tests.result == 'success' &&
      needs.playwright-api-tests.result == 'success')
    uses: ./.github/workflows/playwright-e2e.yml

  robot-framework-tests:
    needs: [backend-unit-tests, frontend-unit-tests, cypress-component-tests, rest-assured-api-tests, newman-api-tests, playwright-api-tests]
    if: >-
      always() &&
      (needs.backend-unit-tests.result == 'success' &&
      needs.frontend-unit-tests.result == 'success' &&
      needs.cypress-component-tests.result == 'success' &&
      needs.rest-assured-api-tests.result == 'success' &&
      needs.newman-api-tests.result == 'success' &&
      needs.playwright-api-tests.result == 'success')
    uses: ./.github/workflows/robot.yml

  selenium-tests:
    needs: [backend-unit-tests, frontend-unit-tests, cypress-component-tests, rest-assured-api-tests, newman-api-tests, playwright-api-tests]
    if: >-
      always() &&
      (needs.backend-unit-tests.result == 'success' &&
      needs.frontend-unit-tests.result == 'success' &&
      needs.cypress-component-tests.result == 'success' &&
      needs.rest-assured-api-tests.result == 'success' &&
      needs.newman-api-tests.result == 'success' &&
      needs.playwright-api-tests.result == 'success')
    uses: ./.github/workflows/selenium.yml

  preprocess:
    needs:
      [cypress-tests, playwright-e2e-tests, robot-framework-tests, selenium-tests]
    if: >-
      github.base_ref == 'main' && 
      always() &&
      (needs.cypress-tests.result == 'success' &&
      needs.playwright-e2e-tests.result == 'success' &&
      needs.robot-framework-tests.result == 'success' &&
      needs.selenium-tests.result == 'success')
    uses: ./.github/workflows/preprocess.yml

  docker-deploy:
    if: needs.preprocess.result == 'success'
    needs: [preprocess]
    uses: ./.github/workflows/docker-deploy.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  pages-deploy:
    if: needs.preprocess.result == 'success'
    needs: [preprocess]
    uses: ./.github/workflows/pages-deploy.yml
    permissions:
      contents: write
